plugins:
  - rubocop-minitest
  - rubocop-rails

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "node_modules/**/*"
    - "vendor/**/*"
    - "test/dummy/db/**/*"
    - "test/dummy/tmp/**/*"
    - "bin/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Max: 200

Metrics/ParameterLists:
  Exclude:
    - "app/components/**/*"

Lint/MissingSuper:
  Exclude:
    - "app/components/**/*"

Layout/LineLength:
  Max: 120

Rails/LexicallyScopedActionFilter:
  Enabled: false

Rails/ApplicationRecord:
  Enabled: false

Rails/ApplicationController:
  Enabled: false

Rails/RakeEnvironment:
  Enabled: false
